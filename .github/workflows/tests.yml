name: Host tests (no KiCad)

# The repository's unit tests run with a plain Python interpreter: numpy for the grid router, PyYAML and Shapely for the
# requirement loaders and pour merging, pytest as the runner. Everything that needs KiCad (kicad-cli ERC/DRC, pcbnew board
# construction, the synthetic routed-board DRC of tests/test_grid_router.py, the V3 and DAB-V1 generators' native stages)
# is detected through automation.setup.detect_kicad and is SKIPPED here, never passed: the job prints the skip reasons
# (-rs) and the summary line states how many tests were skipped. Native ERC/DRC evidence is produced on a workstation
# with KiCad 10 and committed under examples/*/verification with hashed manifests.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the pure-Python parts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Confirm that KiCad is absent (the KiCad-dependent tests must skip, not pass)
        run: |
          python -m automation.setup.detect_kicad || echo "kicad-cli not found: KiCad-dependent tests will be skipped"
      - name: Run the host tests
        run: python -m pytest -q -rs
