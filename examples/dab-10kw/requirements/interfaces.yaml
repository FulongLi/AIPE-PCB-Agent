jtag_header:
  description: "TI 14-pin JTAG / cJTAG header (2x07, 2.54 mm) - pin 6 is the key; wired to the controlCARD JTAG contacts (assumed) so that an external XDS probe can be used instead of the card's on-board XDS110"
  footprint: Connector_PinHeader_2.54mm:PinHeader_2x07_P2.54mm_Vertical
  pins: {1: TMS, 2: TRST_N, 3: TDI, 4: GND_CTRL, 5: 3V3, 6: null, 7: TDO, 8: GND_CTRL, 9: TCK, 10: GND_CTRL, 11: TCK, 12: GND_CTRL, 13: EMU0, 14: EMU1}
can:
  description: "ISO 11898-2 CAN FD transceiver TCAN1042HGV (VCC 5 V, VIO 3.3 V); 3-way pluggable terminal (CANH, CANL, GND); split termination 2 x 60 Ohm + 4.7 nF selectable by a solder jumper footprint"
  connector_footprint: Connector_Phoenix_MC:PhoenixContact_MC_1,5_3-G-3.81_1x03_P3.81mm_Horizontal
  connector_mpn: 1803581
  pins: {1: CANH, 2: CANL, 3: GND_CTRL}
rs485:
  description: "optional THVD1450 half-duplex RS-485 (not populated); 3-way pluggable terminal (A, B, GND)"
  connector_footprint: Connector_Phoenix_MC:PhoenixContact_MC_1,5_3-G-3.81_1x03_P3.81mm_Horizontal
  connector_mpn: 1803581
  pins: {1: RS485_A, 2: RS485_B, 3: GND_CTRL}
auxiliary_input:
