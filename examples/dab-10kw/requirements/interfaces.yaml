# Inter-board interfaces of the AIPE 10 kW DAB (DAB-V1).  The control harness pin map is used verbatim by the
# primary board, the secondary board and the control board models, so the three KiCad projects agree pin for pin
# (a unit test checks this).  The controlCARD edge-connector map is an ASSUMED assignment: it must be reconciled
# with the TI TMDSCNCD280039C controlCARD pin-out document before any board is built (open review item R-01).
schema: 1
control_harness:
  description: "40-way keyed IDC harness between the control board and each power board (Samtec TST-120-01-G-D shrouded header, straight-through 1:1 cable, pin 1 marked); adjacent odd/even pins form signal/return pairs; SELV only - no gate current and no hazardous potential in the cable"
  footprint: Connector_IDC:IDC-Header_2x20_P2.54mm_Vertical
  keying: "shrouded header with centre polarising key; cable connector with matching bump; pin 1 triangle on silkscreen"
  rated_current_per_contact_A: 1.0
  # pin: net name on the power board.  The control board prefixes board-specific nets with P_ (primary) or S_
  # (secondary); shared supply nets keep their names.
  pins:
    1: GND_CTRL
    2: PWM_AH
    3: GND_CTRL
    4: PWM_AL
    5: GND_CTRL
    6: PWM_BH
    7: GND_CTRL
    8: PWM_BL
    9: GND_CTRL
    10: DRV_RST
    11: GND_CTRL
    12: BIAS_EN
    13: FLT_AH_N
    14: FLT_AL_N
    15: FLT_BH_N
    16: FLT_BL_N
    17: RDY_AH
    18: RDY_AL
    19: RDY_BH
    20: RDY_BL
    21: PG_BIAS_N
    22: OC_TRIP_N
    23: TEMP_HS
    24: GND_CTRL
    25: VSNS_P
    26: VSNS_N
    27: ISNS
    28: GND_CTRL
    29: TEMP_PWM_AH
    30: TEMP_PWM_AL
    31: TEMP_PWM_BH
    32: TEMP_PWM_BL
    33: SDFM_CLK
    34: SDFM_D
    35: 12V_E
    36: 12V_E
    37: GND_CTRL
    38: GND_CTRL
    39: 3V3
    40: 3V3
  shared_nets: [GND_CTRL, 12V_E, 3V3, DRV_RST, BIAS_EN]
  direction_from_control: [PWM_AH, PWM_AL, PWM_BH, PWM_BL, DRV_RST, BIAS_EN, SDFM_CLK, 12V_E, 3V3]
  direction_to_control: [FLT_AH_N, FLT_AL_N, FLT_BH_N, FLT_BL_N, RDY_AH, RDY_AL, RDY_BH, RDY_BL, PG_BIAS_N, OC_TRIP_N, TEMP_HS, VSNS_P, VSNS_N, ISNS, TEMP_PWM_AH, TEMP_PWM_AL, TEMP_PWM_BH, TEMP_PWM_BL, SDFM_D]
  notes:
    - "12V_E: two contacts; the five UCC14141 modules of one board draw about 1 A at 12 V worst case - contact derating and cable gauge are review items."
    - "SDFM_CLK / SDFM_D are used by the secondary board (AMC1336); on the primary board they are reserved (not connected)."
    - "VSNS_P / VSNS_N: AMC1311 differential output (about 1.44 V common mode, gain 1); ISNS: TMCS1133 output, 1.65 V at zero current, 25 mV/A."
