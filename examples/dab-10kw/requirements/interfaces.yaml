  connector_footprint: Connector_Phoenix_MC:PhoenixContact_MC_1,5_2-G-3.81_1x02_P3.81mm_Horizontal
  connector_mpn: 1803578
  pins: {1: 12V_IN, 2: GND_CTRL}
heatsink_ntc:
  description: "cabled 10 k NTC on each heat sink (SELV; the heat sink is PE-bonded and the devices are insulated from it)"
  footprint: Connector_JST:JST_PH_B2B-PH-K_1x02_P2.00mm_Vertical
  mpn: B2B-PH-K-S
  pins: {1: NTC_HS, 2: GND_CTRL}
hv_terminals:
  primary: {J1: BUS_P, J2: PGND, J3: SW_A, J4: AC_B}
  secondary: {J1: BUS_P, J2: PGND, J3: SW_A, J4: AC_B}
  description: "Wuerth REDCUBE THR 74651195 (M4 internal thread) press-in terminals; SW_A connects to the external series inductor (primary) or directly to the transformer (secondary), AC_B to the transformer winding through the Hall sensor"
