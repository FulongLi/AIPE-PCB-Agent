# Component selections of the AIPE 10 kW DAB (DAB-V1).  Every entry names a real orderable part, its
# manufacturer and the manufacturer document that the design relies on.  "verification" states how the
# pin table / dimensions used by automation/dab_v1 were established:
#   fetched-datasheet  - the manufacturer PDF was read (by this or an earlier AIPE run recorded in the repository)
#   repository-record  - taken from a pin table already verified and recorded in this repository (sic_buck models)
#   transcribed        - written from engineering knowledge of the part; MUST be checked against the datasheet
#   library-convention - KiCad library pad numbering (two-pad parts, headers)
# Nothing here is a procurement approval.  Dimensions marked "envelope" are reserved volumes, not vendor CAD.
